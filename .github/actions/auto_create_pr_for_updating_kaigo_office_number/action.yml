name: Auto Create PR for Updating Kaigo Office Number
description: '介護事業所番号を更新するためのPRを自動生成する'

inputs:
  kaigo_office_number_ids:
    description: 'BigQueryから取得した介護事業所番号IDのリスト（カンマ区切り）'
    required: true
  current_kaigo_office_number:
    description: '現在の事業所番号'
    required: true
  target_kaigo_office_number:
    description: '変更後の事業所番号'
    required: true
  apply_date:
    description: '適用予定日 (YYYY-MM-DD形式)'
    required: true
  houjin_id:
    description: 'テナントID (法人ID)'
    required: true
  github_token:
    description: 'GitHub Token for creating PR'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Validate Kaigo Office Number IDs
      shell: bash
      env:
        KAIGO_OFFICE_NUMBER_IDS: ${{ inputs.kaigo_office_number_ids }}
      run: |
        echo "📋 Validating kaigo_office_number_ids..."
        echo "Kaigo Office Number IDs: $KAIGO_OFFICE_NUMBER_IDS"

        if [[ -z "$KAIGO_OFFICE_NUMBER_IDS" || "$KAIGO_OFFICE_NUMBER_IDS" == "(none)" ]]; then
          echo "❌ Error: No valid kaigo_office_number_ids provided"
          exit 1
        fi
        echo "✅ Validation passed"

    - name: Generate Timestamp and SQL Files
      id: generate-sql
      shell: bash
      env:
        KAIGO_OFFICE_NUMBER_IDS: ${{ inputs.kaigo_office_number_ids }}
        CURRENT_NUMBER: ${{ inputs.current_kaigo_office_number }}
        TARGET_NUMBER: ${{ inputs.target_kaigo_office_number }}
      run: |
        echo "📝 Generating SQL migration files..."

        # Generate timestamp in YYYYMMDDTHHmmss format
        TIMESTAMP=$(date -u +"%Y%m%dT%H%M%S")
        echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

        # Create migrations directory if it doesn't exist
        MIGRATIONS_DIR="db-operations/environments/production/hcs/migrations"
        mkdir -p "$MIGRATIONS_DIR"

        # Convert comma-separated IDs to SQL format: 'id1','id2','id3'
        # Remove spaces and convert to quoted format
        SQL_IDS=$(echo "$KAIGO_OFFICE_NUMBER_IDS" | sed "s/, */\',\'/g" | sed "s/^/\'/;s/$/\'/")
        echo "SQL formatted IDs: $SQL_IDS"

        # Generate UP migration file
        UP_FILE="${MIGRATIONS_DIR}/${TIMESTAMP}_update_kaigo_office_number.up.sql"
        cat > "$UP_FILE" <<EOF
        BEGIN;
        UPDATE office.kaigo_office_number ko
        SET number = '$TARGET_NUMBER'
        WHERE ko.kaigo_office_number_id IN ($SQL_IDS);

        COMMIT;
        EOF

        # Remove leading whitespace from SQL file
        sed -i 's/^        //' "$UP_FILE"

        echo "✅ Created UP migration file: $UP_FILE"
        cat "$UP_FILE"

        # Generate DOWN migration file
        DOWN_FILE="${MIGRATIONS_DIR}/${TIMESTAMP}_update_kaigo_office_number.down.sql"
        cat > "$DOWN_FILE" <<EOF
        BEGIN;
        UPDATE office.kaigo_office_number ko
        SET number = '$CURRENT_NUMBER'
        WHERE ko.kaigo_office_number_id IN ($SQL_IDS);

        COMMIT;
        EOF

        # Remove leading whitespace from SQL file
        sed -i 's/^        //' "$DOWN_FILE"

        echo "✅ Created DOWN migration file: $DOWN_FILE"
        cat "$DOWN_FILE"

        echo "up_file=$UP_FILE" >> $GITHUB_OUTPUT
        echo "down_file=$DOWN_FILE" >> $GITHUB_OUTPUT

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
      with:
        token: ${{ inputs.github_token }}
        commit-message: "fix: [Auto-generated] update kaigo_office_number for houjin_id: ${{ inputs.houjin_id }}"
        committer: GitHub <noreply@github.com>
        author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        title: "[Auto-generated] 介護事業所番号を更新 (法人ID: ${{ inputs.houjin_id }})"
        body: |
          ## 概要
          介護事業所番号の更新マイグレーションファイルを自動生成しました。

          ## 変更内容
          - **法人ID (houjin_id)**: `${{ inputs.houjin_id }}`
          - **現在の事業所番号**: `${{ inputs.current_kaigo_office_number }}`
          - **変更後の事業所番号**: `${{ inputs.target_kaigo_office_number }}`
          - **適用予定日**: `${{ inputs.apply_date }}`
          - **対象 kaigo_office_number_id**: `${{ inputs.kaigo_office_number_ids }}`

          ## 生成されたファイル
          - `${{ steps.generate-sql.outputs.up_file }}`
          - `${{ steps.generate-sql.outputs.down_file }}`

          ---
          Auto-generated by [auto_create_pr_for_updating_kaigo_office_number workflow](https://github.com/${{ github.repository }}/actions/workflows/auto_create_pr_for_updating_kaigo_office_number.yml)
        base: main
        branch: hcs/update-kaigo-office-number-${{ inputs.houjin_id }}-${{ steps.generate-sql.outputs.timestamp }}
        delete-branch: true

    - name: Display PR Creation Summary
      shell: bash
      env:
        TIMESTAMP: ${{ steps.generate-sql.outputs.timestamp }}
        HOUJIN_ID: ${{ inputs.houjin_id }}
      run: |
        echo ""
        echo "================================================"
        echo "✅ Pull Request 作成完了"
        echo "================================================"
        echo "Branch: hcs/update-kaigo-office-number-${HOUJIN_ID}-${TIMESTAMP}"
        echo "Files created:"
        echo "  - ${{ steps.generate-sql.outputs.up_file }}"
        echo "  - ${{ steps.generate-sql.outputs.down_file }}"
        echo "================================================"
